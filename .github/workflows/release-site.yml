name: Build and publish site

on:
  push:
    branches: [main]
    paths-ignore:
      - public/downloads/**
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: pnpm install --frozen-lockfile
      - run: pnpm release
      - name: Commit raw-download assets
        run: |
          git config user.name 'Gitai'
          git config user.email 'i@gitai.me'
          git add -f public/downloads/telay-* public/downloads/SHA256SUMS public/downloads/THIRD_PARTY_LICENSES.txt
          git add public/downloads/THIRD_PARTY_NOTICES.txt
          git diff --cached --quiet || git commit -m "chore: update downloadable builds"
          git push
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
