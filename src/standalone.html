<!doctype html>
<html lang="en">
  <head>
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f7f5f0" />
  </head>
  <body>
    <div class="relay-shell">
      <header
        class="flex items-center justify-between gap-4 px-6 py-7 sm:px-10"
      >
        <a
          href="/"
          class="text-lg font-medium tracking-tight"
          data-i18n-aria-label="home"
          aria-label="Telay home"
          ><span class="font-bold text-accent">T</span>elay</a
        >
        <div class="flex items-center gap-2">
          <a
            class="quiet-button"
            href="https://github.com/telay-dev/telay-dev.github.io"
            aria-label="GitHub"
          >
            <svg
              aria-hidden="true"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="currentColor"
            >
              <path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-1.88c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.71 2.62 1.22 3.26.93.1-.73.39-1.22.71-1.5-2.5-.29-5.14-1.26-5.14-5.57 0-1.23.44-2.24 1.16-3.03-.12-.28-.5-1.43.11-2.99 0 0 .95-.3 3.09 1.16a10.7 10.7 0 0 1 5.62 0c2.14-1.46 3.09-1.16 3.09-1.16.61 1.56.23 2.71.11 2.99.73.79 1.16 1.8 1.16 3.03 0 4.32-2.64 5.28-5.16 5.56.41.35.77 1.04.77 2.1v2.86c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z" />
            </svg>
          </a>
          <div data-language-menu></div>
        </div>
      </header>
      <main class="mx-auto w-full max-w-lg flex-1 px-6 pb-12 pt-10 sm:pt-20">
        <h1 class="hero-heading mb-10">
          <span data-i18n="headingLead">Secure access to</span>
          <span class="hero-heading-accent" data-i18n="headingEmphasis"
            >your local web server</span
          >
        </h1>
        <form id="standalone-form">
          <label
            for="standalone-pair"
            class="mb-3 block text-sm font-medium"
            data-i18n="pairLabel"
            >Pairing address</label
          >
          <input
            id="standalone-pair"
            type="password"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="pairPlaceholder"
            placeholder="Paste the tc… address from your device"
            aria-describedby="standalone-hint"
            class="field w-full font-mono"
          />
          <p
            id="standalone-hint"
            class="mt-3 text-xs leading-5 text-muted"
            data-i18n="pairHint"
          >
            This address grants access to your device. Keep it private.
          </p>
          <div id="standalone-recent" class="mt-3" hidden>
            <div class="flex items-center gap-2">
              <select
                id="standalone-history"
                class="recent-select flex-1"
                data-i18n-aria-label="recentAddresses"
                aria-label="Recent connections"
              ></select>
              <button
                id="standalone-clear"
                class="quiet-button text-xs text-muted"
                type="button"
                data-i18n="clearHistory"
              >
                Clear
              </button>
            </div>
            <p
              id="standalone-history-hint"
              class="text-xs leading-5 text-muted"
              data-i18n="historyPrivacy"
            >
              Saved in this browser. Avoid shared devices.
            </p>
          </div>
          <button
            id="standalone-connect"
            type="submit"
            class="btn mt-7 w-full"
            data-i18n="connectAndOpen"
          >
            Connect and open
          </button>
        </form>
        <p
          id="standalone-status"
          role="status"
          class="mt-4 min-h-11 py-3 text-xs leading-5 text-muted"
          data-i18n="disconnected"
        >
          Not connected
        </p>
        <p
          id="standalone-error"
          role="alert"
          class="mt-2 text-sm leading-6 text-danger"
          hidden
        ></p>
        <a
          href="/"
          class="text-link mt-9 inline-block text-sm text-muted"
          data-i18n="installAndHelp"
          >Installation and help</a
        >
      </main>
    </div>
  </body>
</html>
